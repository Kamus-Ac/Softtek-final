  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de personal con sub, role, restaurant_id, exp, iss y aud verificados.
    VisionBearer:
      type: http
      scheme: bearer
      description: Credencial de dispositivo aprovisionada fuera de la API pública;
        vinculada a restaurante y cámaras.
    ReservationBearer:
      type: http
      scheme: bearer
      description: Token opaco aleatorio de gestión de UNA reserva; solo se almacena
        su hash en servidor.
  responses:
    Error400:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Credencial ausente, inválida o expirada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Permiso insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso no encontrado o ajeno al restaurante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Conflicto de estado o disponibilidad
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Límite de intentos excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Segundos antes de reintentar
          schema:
            type: integer
            minimum: 1
    Error500:
      description: Error interno sin detalles sensibles
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
