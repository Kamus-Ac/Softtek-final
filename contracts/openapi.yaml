openapi: 3.1.0
info:
  title: Plataforma de restaurantes
  version: 0.1.0
  description: Contrato inicial para demo. Reglas de negocio, permisos y WebSocket
    en contracts/README.md. No implica backend implementado.
servers:
- url: http://localhost:8000/api/v1
  description: Desarrollo local
tags:
- name: Auth
- name: Gestión
- name: Público
- name: Visión
paths:
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión de personal
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      description: El restaurant_id selecciona el contexto; la API verifica membresía.
        Aplicar rate limiting. No almacenar tokens en URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Consultar sesión
      tags:
      - Auth
      security:
      - StaffBearer: []
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-roles:
      - platform_admin
      - gerente
      - mesero
      - cocina
  /restaurants:
